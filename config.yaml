# JobHunting 配置
# 启动前复制为 .env 并填入飞书配置

# ── 职位来源 ──────────────────────────────────────────────────────────
sources:
  remotive:
    enabled: true
    keywords:
      - "AI agent"
      - "LLM"
      - "LangChain"
      - "blockchain"
      - "DeFi"
      - "smart contract"
      - "Rust developer"
      - "Golang blockchain"
      - "quantitative trading"
      - "crypto"
    exclude_keywords:
      - "intern"
      - "internship"
      - "part time"
      - "volunteer"
    max_results: 100

  cryptjobslist:
    enabled: true
    keywords:
      - "blockchain"
      - "defi"
      - "smart contract"
      - "solidity"
      - "rust developer"
    exclude_keywords:
      - "intern"
    max_results: 50

  web3career:
    enabled: true
    keywords:
      - "blockchain"
      - "defi"
      - "solidity"
      - "web3"
    exclude_keywords:
      - "intern"
    max_results: 50

  # RemoteOK：英文 Remote-only 聚合，官方免费 API
  remoteok:
    enabled: true
    keywords:
      - "ai"
      - "llm"
      - "agent"
      - "blockchain"
      - "crypto"
      - "defi"
      - "solidity"
      - "web3"
      - "golang"
      - "rust"
      - "backend"
    exclude_keywords:
      - "intern"
      - "part time"
    max_results: 60

# ── 评分配置 ──────────────────────────────────────────────────────────
# 标题优先：标题命中是最强信号；描述命中封顶防止长 JD 堆词刷分；
# 人才库（Lemon.io 等"先进池子再匹配"的中介）降权
scoring:
  core_keywords:
    - "ai agent"
    - "llm"
    - "langchain"
    - "openai"
    - "gpt"
    - "agentic"
    - "defi"
    - "smart contract"
    - "solidity"
    - "web3"
    - "blockchain"
    - "crypto"
    - "trading"
    - "quantitative"
    - "backend"
    - "golang"
    - "rust"
    - "distributed"
    - "microservice"
    - "fastapi"

  secondary_keywords:
    - "python"
    - "kubernetes"
    - "docker"
    - "aws"
    - "gcp"
    - "postgresql"
    - "redis"
    - "git"
    - "ci/cd"
    - "devops"

  title_weight: 20.0        # 标题核心词命中 ×20（不封顶）
  core_weight: 10.0         # 描述核心词命中 ×10
  desc_core_cap: 3          # 描述核心词最多计 3 次（封顶 30 分）
  secondary_weight: 5.0     # 次要词命中 ×5
  secondary_cap: 4          # 次要词最多计 4 次（封顶 20 分）
  salary_bonus: 10.0        # 薪资透明 +10
  talent_penalty: -30.0     # 人才库/中介惩罚
  talent_companies:         # 惩罚名单（公司名包含即命中）
    - "lemon.io"
    - "toptal"
    - "torc"
    - "andela"
    - "adeva"
    - "arc.dev"
    - "turing.com"
    - "x-team"
    - "gun.io"
    - "braintrust"
    - "talent500"
    - "crossover"

  # 地域适配（候选人所在地：上海/中国）
  # 地点含 APAC/Worldwide 等可入职地区 +10；限定美/欧时区 -50（无法入职）；仅 Remote 中性
  location_bonus: 10.0
  location_penalty: -50.0
  location_eligible:
    - "worldwide"
    - "global"
    - "anywhere"
    - "apac"
    - "asia"
    - "singapore"
    - "china"
    - "hong kong"
    - "taiwan"
    - "japan"
    - "seoul"
  location_restricted:
    - "usa"
    - "u.s."
    - "united states"
    - "northern america"
    - "north america"
    - "europe"
    - "emea"
    - "uk only"
    - "latam only"
    - "canada only"

  min_score: 40.0
  max_score: 100.0

# ── 飞书推送 ──────────────────────────────────────────────────────────
notify:
  enabled: true
  daily_max: 15

# ── LLM 配置（可选，启用后解锁智能功能）─────────────────────────────
# provider: anthropic (MiniMax/DeepSeek 等兼容接口) / openai
# api_key / base_url / model 均可被同名环境变量覆盖
# MiniMax 默认使用 FI-Agent 的 MiniMax 端点
llm:
  enabled: false       # 设为 true 启用 LLM；或保持 false，只要有 .env LLM_API_KEY 会自动激活
  # provider: anthropic
  # api_key: sk-xxx          # MiniMax/DeepSeek API Key
  # base_url: https://api.minimaxi.com/anthropic
  # model: MiniMax-M2.7-highspeed
  # score_above: 60           # 只对 >= 此分数的职位做 LLM 分析（节省 token）

# ── 全局 ─────────────────────────────────────────────────────────────
dedup_days: 7
retention_days: 90        # 职位数据保留天数（超期自动清理，已投递的永久保留）
followup_days: 7          # 投递后 N 天无回复则推送跟进提醒
log_level: INFO
